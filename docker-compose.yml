services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: manage
      POSTGRES_PASSWORD: manage
      POSTGRES_DB: manage_teams
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manage -d manage_teams"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
