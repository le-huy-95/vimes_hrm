openapi: 3.0.3
info:
  title: Manage Teams API
  version: 0.3.0
  description: Auth, orgs, teams, Google Workspace sync, GitHub App + webhooks
servers:
  - url: http://localhost:3002
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /auth/register:
    post:
      summary: Register with email/password (creates org)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName, orgName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                fullName: { type: string }
                orgName: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/refresh:
    post:
      summary: Refresh access token (cookie)
      responses:
        "200":
          description: OK
  /auth/logout:
    post:
      summary: Logout
      responses:
        "204":
          description: No content
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Current user
      responses:
        "200":
          description: OK
  /auth/google:
    get:
      summary: Start Google OAuth
      responses:
        "302":
          description: Redirect
  /orgs/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Current organization
      responses:
        "200":
          description: OK
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update organization
      responses:
        "200":
          description: OK
  /orgs/me/workspace/auth-status:
    get:
      security: [{ bearerAuth: [] }]
      summary: Workspace auth status (SA / OAuth / canSync)
      responses:
        "200":
          description: OK
  /orgs/me/workspace/connect:
    get:
      security: [{ bearerAuth: [] }]
      summary: Start Workspace Admin OAuth (redirect)
      responses:
        "302":
          description: Redirect to Google
  /orgs/me/workspace/connect/callback:
    get:
      summary: Workspace OAuth callback (state cookie; no JWT)
      responses:
        "302":
          description: Redirect to web app
  /orgs/me/google-sync:
    post:
      security: [{ bearerAuth: [] }]
      summary: Enqueue Google Workspace directory sync
      responses:
        "202":
          description: Queued
  /orgs/me/google-sync/status:
    get:
      security: [{ bearerAuth: [] }]
      summary: Latest sync status + lock
      responses:
        "200":
          description: OK
  /orgs/me/google-sync/logs:
    get:
      security: [{ bearerAuth: [] }]
      summary: Paginated sync logs
      parameters:
        - in: query
          name: take
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: skip
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
  /orgs/me/google-sync/users:
    get:
      security: [{ bearerAuth: [] }]
      summary: Paginated synced Workspace users
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: take
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: OK
  /orgs/me/google-groups:
    get:
      security: [{ bearerAuth: [] }]
      summary: List Google Workspace groups
      responses:
        "200":
          description: OK
  /orgs/me/google-groups/{groupEmail}/team:
    put:
      security: [{ bearerAuth: [] }]
      summary: Map Google group to team
      parameters:
        - in: path
          name: groupEmail
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId: { type: string }
      responses:
        "200":
          description: OK
    delete:
      security: [{ bearerAuth: [] }]
      summary: Unmap Google group from team
      parameters:
        - in: path
          name: groupEmail
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No content
  /teams:
    get:
      security: [{ bearerAuth: [] }]
      summary: List teams
      parameters:
        - in: query
          name: as
          schema: { type: string, enum: [tree] }
      responses:
        "200":
          description: OK
    post:
      security: [{ bearerAuth: [] }]
      summary: Create team (creator becomes lead)
      responses:
        "201":
          description: Created
  /teams/{teamId}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Get team
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: OK
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update team (team:manage)
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: OK
    delete:
      security: [{ bearerAuth: [] }]
      summary: Delete team (rejects if children)
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "204":
          description: No content
  /teams/{teamId}/members:
    get:
      security: [{ bearerAuth: [] }]
      summary: List members
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: OK
    post:
      security: [{ bearerAuth: [] }]
      summary: Invite member by email
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "201":
          description: Created
  /teams/github/install/callback:
    get:
      summary: GitHub App install callback (public; state cookie)
      parameters:
        - in: query
          name: installation_id
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to web app
  /teams/{teamId}/github/install-url:
    get:
      security: [{ bearerAuth: [] }]
      summary: Get GitHub App install URL (team:manage)
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
  /teams/{teamId}/github/connection:
    get:
      security: [{ bearerAuth: [] }]
      summary: Get GitHub connection status (team:view)
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: Connection or null
    delete:
      security: [{ bearerAuth: [] }]
      summary: Disconnect GitHub App (team:manage)
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "204":
          description: No content
  /teams/{teamId}/github/repos:
    get:
      security: [{ bearerAuth: [] }]
      summary: List synced GitHub repos (team:view)
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: OK
  /teams/{teamId}/github/sync:
    post:
      security: [{ bearerAuth: [] }]
      summary: Enqueue repo sync (team:manage)
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "202":
          description: Accepted
  /teams/{teamId}/github/activity:
    get:
      security: [{ bearerAuth: [] }]
      summary: Paginated GitHub activity feed (team:view)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: take
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
  /teams/{teamId}/projects:
    get:
      security: [{ bearerAuth: [] }]
      summary: List projects (team:view)
      parameters:
        - $ref: "#/components/parameters/teamId"
      responses:
        "200":
          description: OK
    post:
      security: [{ bearerAuth: [] }]
      summary: Create project (team:manage)
      parameters:
        - $ref: "#/components/parameters/teamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created
  /teams/{teamId}/projects/{projectId}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Get project (team:view)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: OK
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update project (team:manage)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: OK
    delete:
      security: [{ bearerAuth: [] }]
      summary: Delete project incl. tasks cascade (team:manage)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "204":
          description: No content
  /teams/{teamId}/projects/{projectId}/tasks:
    get:
      security: [{ bearerAuth: [] }]
      summary: List tasks (team:view)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: OK
    post:
      security: [{ bearerAuth: [] }]
      summary: Create task (task:write)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "201":
          description: Created
  /teams/{teamId}/tasks/{taskId}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Get task (team:view)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/taskId"
      responses:
        "200":
          description: OK
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update task (task:write)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/taskId"
      responses:
        "200":
          description: OK
    delete:
      security: [{ bearerAuth: [] }]
      summary: Delete task (task:write)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/taskId"
      responses:
        "204":
          description: No content
  /teams/{teamId}/tasks/{taskId}/comments:
    get:
      security: [{ bearerAuth: [] }]
      summary: List task comments (team:view)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/taskId"
      responses:
        "200":
          description: OK
    post:
      security: [{ bearerAuth: [] }]
      summary: Add task comment (task:write)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/taskId"
      responses:
        "201":
          description: Created
  /teams/{teamId}/tasks/{taskId}/comments/{commentId}:
    delete:
      security: [{ bearerAuth: [] }]
      summary: Delete comment, author or team:manage (task:write)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/taskId"
        - $ref: "#/components/parameters/commentId"
      responses:
        "204":
          description: No content
  /orgs/me/avatar:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Set avatar from a confirmed file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId]
              properties:
                fileId: { type: string }
      responses:
        "200":
          description: OK
  /files/presign:
    post:
      security: [{ bearerAuth: [] }]
      summary: Get a presigned PUT URL to upload a file directly to storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originalName, mimeType, sizeBytes, entityType]
              properties:
                originalName: { type: string }
                mimeType: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif, application/pdf] }
                sizeBytes: { type: integer }
                entityType: { type: string, enum: [avatar, task_attachment, other] }
                entityId: { type: string }
      responses:
        "200":
          description: OK
  /files/confirm:
    post:
      security: [{ bearerAuth: [] }]
      summary: Confirm an upload, create the file record, enqueue thumbnail if image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucketKey, originalName, mimeType, sizeBytes, entityType]
              properties:
                bucketKey: { type: string }
                originalName: { type: string }
                mimeType: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif, application/pdf] }
                sizeBytes: { type: integer }
                entityType: { type: string, enum: [avatar, task_attachment, other] }
                entityId: { type: string }
      responses:
        "201":
          description: Created
  /files/{fileId}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Get file metadata with short-lived download and thumbnail URLs
      parameters:
        - $ref: "#/components/parameters/fileId"
      responses:
        "200":
          description: OK
  /teams/{teamId}/tasks/{taskId}/attachments:
    get:
      security: [{ bearerAuth: [] }]
      summary: List task attachments (team:view)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/taskId"
      responses:
        "200":
          description: OK
    post:
      security: [{ bearerAuth: [] }]
      summary: Attach a confirmed file to a task (task:write)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/taskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId]
              properties:
                fileId: { type: string }
      responses:
        "201":
          description: Created
  /teams/{teamId}/tasks/{taskId}/attachments/{fileId}:
    delete:
      security: [{ bearerAuth: [] }]
      summary: Detach a file from a task (task:write)
      parameters:
        - $ref: "#/components/parameters/teamId"
        - $ref: "#/components/parameters/taskId"
        - $ref: "#/components/parameters/fileId"
      responses:
        "204":
          description: No content
  /webhooks/github:
    post:
      summary: GitHub App webhook (HMAC signature; no JWT)
      parameters:
        - in: header
          name: X-Hub-Signature-256
          required: true
          schema: { type: string }
        - in: header
          name: X-GitHub-Delivery
          required: true
          schema: { type: string }
        - in: header
          name: X-GitHub-Event
          required: true
          schema: { type: string }
      responses:
        "202":
          description: Accepted
        "200":
          description: Duplicate delivery
        "401":
          description: Invalid signature
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    teamId:
      in: path
      name: teamId
      required: true
      schema: { type: string }
    projectId:
      in: path
      name: projectId
      required: true
      schema: { type: string }
    taskId:
      in: path
      name: taskId
      required: true
      schema: { type: string }
    commentId:
      in: path
      name: commentId
      required: true
      schema: { type: string }
    fileId:
      in: path
      name: fileId
      required: true
      schema: { type: string }
  schemas:
    Session:
      type: object
      properties:
        accessToken: { type: string }
        user:
          type: object
          properties:
            sub: { type: string }
            orgId: { type: string }
            email: { type: string }
